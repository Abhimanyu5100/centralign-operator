[project]
name = "centralign-operator"
version = "0.1.0"
description = "AI operator that turns a short company request into completed, verified work inside a mock company (Acme)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "pydantic>=2",
    "reportlab",
    "pypdf",
    "playwright",
    "python-dotenv",
    "pyyaml",
    "httpx",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["e2e: needs a real browser, a running Acme server or an oracle run; excluded from `make test`"]
