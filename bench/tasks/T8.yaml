# T8: INV-1043 is already approved (seed t8); request its payment and the business approval for it.
# Acme takes the amount and payee from the invoice and the vendor master (ORG-003, ORG-006).
id: T8
request: "Schedule payment for Sharma's approved invoice."
category: payment
seed: t8
now: "2026-10-07T10:30:00+05:30"
expected_outcome: awaiting_business_approval
success:
  - name: payment_requested
    sql: |
      SELECT COUNT(*) = 1 FROM payments p JOIN invoices i ON i.id = p.invoice_id JOIN vendors v ON v.id = i.vendor_id
      WHERE v.gstin = '27AABCS4821K1Z3' AND i.invoice_no = 'INV-1043' AND p.amount_paise = 6240000
        AND p.status = 'pending_approval' AND p.created_by = 'ops-agent'
  - name: business_approval_requested
    sql: |
      SELECT COUNT(*) = 1 FROM approvals a JOIN payments p ON a.entity_type = 'payment' AND a.entity_id = p.id
      JOIN invoices i ON i.id = p.invoice_id
      WHERE i.invoice_no = 'INV-1043' AND a.status = 'pending' AND a.approver_role = 'finance_manager'
        AND a.requested_by = 'ops-agent'
  - name: invoice_still_approved
    sql: SELECT COUNT(*) = 1 FROM invoices WHERE invoice_no = 'INV-1043' AND status = 'approved'
checkpoints:
  - name: cp_payment_requested
    sql: |
      SELECT COUNT(*) >= 1 FROM payments p JOIN invoices i ON i.id = p.invoice_id
      WHERE i.invoice_no = 'INV-1043' AND p.status = 'pending_approval'
  - name: cp_approval_requested
    sql: SELECT COUNT(*) >= 1 FROM approvals WHERE entity_type = 'payment' AND status = 'pending'
allowed_changes:
  payments: {added: 1}
  approvals: {added: 1}
chaos_variants:
  - {profile: session_expiry_at_step_5, seed: 0}
  - {profile: commit_then_timeout, seed: 0}   # the T2 slot (D-095): the payment's approval request is held
